<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Form pemesanan kunjungan ke Raja Ampat." />
  <link rel="stylesheet" href="style.css" />
  <title>Pesan Kunjungan - Pesona Raja Ampat</title>
</head>
<body>

  <!-- ===== NAVBAR ===== -->
  <header class="navbar">
    <a class="logo" href="index.html">Raja Ampat</a>
    <nav>
      <ul>
        <li><a href="tentang.html">Tentang</a></li>
        <li><a href="daya-tarik.html">Daya Tarik</a></li>
        <li><a href="galeri.html">Galeri</a></li>
        <li><a href="tiket.html">Tiket</a></li>
        <li><a href="pesan.html" class="aktif">Pesan</a></li>
      </ul>
    </nav>
  </header>

  <main class="halaman">

    <section id="pesan" class="blok">
      <h2>Pesan Kunjungan</h2>
      <form action="#" method="post">
        <div class="kotak-form">
          <h3>Data Pengunjung</h3>
          <table class="tabel-form">
            <tr>
              <td><label for="nama">Nama</label></td>
              <td><input type="text" id="nama" name="nama" required /></td>
            </tr>
            <tr>
              <td><label for="email">Email</label></td>
              <td><input type="email" id="email" name="email" required /></td>
            </tr>
            <tr>
              <td><label for="tgl">Tanggal Kunjungan</label></td>
              <td><input type="date" id="tgl" name="tgl" /></td>
            </tr>
            <tr>
              <td><label for="jml">Jumlah Orang</label></td>
              <td><input type="number" id="jml" name="jml" min="1" max="20" /></td>
            </tr>
            <tr>
              <td><label for="paket">Paket</label></td>
              <td>
                <select id="paket" name="paket">
                  <option>Snorkeling</option>
                  <option>Diving</option>
                  <option>Island Hopping</option>
                </select>
              </td>
            </tr>
            <tr>
              <td><label for="catatan">Catatan</label></td>
              <td><textarea id="catatan" name="catatan" rows="3"></textarea></td>
            </tr>
            <tr>
              <td></td>
              <td><button type="submit">Kirim Pesanan</button></td>
            </tr>
          </table>
        </div>
      </form>
    </section>

  </main>

</body>
</html>
